[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json = "1"
capture.workspace = true
encoder.workspace = true
input.workspace = true
transport.workspace = true
protocol.workspace = true

[features]
# KDE Plasma support: PipeWire capture and NVENC/x264 encoding. Off by default
# so a Hyprland build never needs libpipewire or the KDE protocol XML.
plasma = ["capture/plasma"]

[[bin]]
name = "moreland"
path = "src/main.rs"
